[package]
name = "bookhead"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
bincode = "=2.0.0-rc.3"

burn = { version = "0.13", features = ["train", "autodiff"] }
burn-ndarray = "0.13"
burn-wgpu = "0.13"
pollster = "0.3"
wgpu = "0.19"
